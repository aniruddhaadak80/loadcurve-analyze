[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loadcurve_analyze"
version = "0.1.0"
description = "Deterministic engine for loadcurve-analyze"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "aniruddhaadak80" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
loadcurve_analyze-engine = "loadcurve_analyze.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/loadcurve_analyze"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
markers = [
  "property: property-based tests using hypothesis",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Narrow on purpose. A wide select on a new repo is a wall of noise that gets ignored.
select = ["E", "F", "W", "B", "UP", "ASYNC", "S", "PL"]
ignore = [
  "E501",    # line length is the formatter's job
  "B008",
  "S101",    # assert is fine in tests
  # Size rules. The engine's functions are branch-heavy on purpose — a propagation sweep is
  # a chain of "for each constraint kind" cases, and splitting them across helpers would
  # hide the one loop a reader needs to follow in order to trust the result. `propagate` and
  # `_form_for` are the two places that earns it, and both stay well under the limits the
  # TypeScript side enforces (2000 lines/file, 300 lines/function).
  "PLR0912", # too-many-branches
  "PLR0913", # too-many-arguments
  "PLR0915", # too-many-statements
  "PLR2004", # magic-value-comparison: domain constants are named where they matter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.11"
platform = "linux"   # keeps the type gate host-independent
strict = true
warn_unreachable = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["hypothesis.*"]
ignore_missing_imports = true
