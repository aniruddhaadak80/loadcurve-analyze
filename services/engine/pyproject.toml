[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loadcurve_analyze"
version = "0.1.0"
description = "Deterministic engine for loadcurve-analyze"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "aniruddhaadak80" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.16",
  "mypy>=1.11",
]

[project.scripts]
loadcurve_analyze-engine = "loadcurve_analyze.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/loadcurve_analyze"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
markers = [
  "property: property-based tests using hypothesis",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Narrow on purpose. A wide select on a new repo is a wall of noise that gets ignored.
select = ["E", "F", "W", "B", "UP", "ASYNC", "S", "PL"]
ignore = [
  "E501",    # line length is the formatter's job
  "B008",
  "S101",    # assert is fine in tests
  # Size rules. The engine's functions are wide on purpose: a propagation sweep is a chain of
  # "for each constraint kind" cases, and splitting them across helpers would hide the one
  # loop a reader needs to follow to trust the result. Three functions earn the exemption —
  # `_form_for`, `_minimal_move` and `contingency` — and all three stay well under the limits
  # the TypeScript side enforces (2000 lines/file, 300 lines/function).
  #
  # `PLR0913`/`PLR0917` are the argument-count pair. `_form_for` takes the precomputed context
  # (factors, bus order, branch positions, hours) as separate arguments rather than a state
  # object: an explicit tuple is checked by mypy, whereas a mutable context would let one call
  # silently observe another's changes.
  "PLR0912", # too-many-branches
  "PLR0913", # too-many-arguments
  "PLR0917", # too-many-positional-arguments — see [tool.ruff.lint.pylint] below
  "PLR0915", # too-many-statements
  "PLR2004", # magic-value-comparison: domain constants are named where they matter
]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.11"
platform = "linux"   # keeps the type gate host-independent
strict = true
warn_unreachable = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["hypothesis.*"]
ignore_missing_imports = true
